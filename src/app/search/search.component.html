<section class="search-page">
  <div class="search-hero">
    <h1 class="hero-title">Find Your City</h1>
    <p class="hero-subtitle">Search for any city to get up-to-date weather information</p>
  </div>

  <div class="search-container">
    <form class="search-form" (ngSubmit)="onSearch()">
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          id="cityInput"
          type="text"
          placeholder="Try 'London', 'Tokyo', or 'Paris'..."
          [(ngModel)]="query"
          name="city"
          autocomplete="off"
          class="search-input"
        />
        <button type="submit" class="search-button" [disabled]="isLoading">
          <span *ngIf="!isLoading">Search</span>
          <span *ngIf="isLoading">Searching...</span>
        </button>
      </div>
    </form>

    <div class="status-container" *ngIf="!cities.length && !isLoading && !query">
      <p class="status-message">💡 Try searching for cities like New York, Dubai, or Sydney</p>
    </div>

    <div class="status-container error" *ngIf="!isLoading && errorMessage">
      <p class="status-message">❌ {{ errorMessage }}</p>
    </div>

    <div class="results-container" *ngIf="!isLoading && cities.length">
      <h2 class="results-title">{{ cities.length }} city(ies) found</h2>
      <ul class="results-grid">
        <li *ngFor="let city of cities" class="result-card">
          <div class="card-content">
            <div class="city-info">
              <h3 class="city-name">{{ city.name }}</h3>
              <p class="city-location">{{ city.admin1 ? city.admin1 + ', ' : '' }}{{ city.country }}</p>
            </div>
          </div>
          <button type="button" (click)="viewWeather(city)" class="action-button">
            <span>View Weather</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </li>
      </ul>
    </div>
  </div>
</section>
